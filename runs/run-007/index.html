<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat / decision-point viz</title>
<style>
  :root{--bg:#eef1f5;--panel:#fff;--line:#e2e6ea;--text:#1c2530;--muted:#6b7787;--accent:#2f6fed}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
    padding:10px 16px;display:flex;gap:12px;align-items:center}
  h1{font-size:15px;margin:0}
  .muted{color:var(--muted)}
  .btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;cursor:pointer;font:inherit}
  main{max-width:860px;margin:0 auto;padding:16px 16px 80px}
  .drop{border:2px dashed var(--line);border-radius:12px;padding:40px;text-align:center;color:var(--muted);margin-top:40px}

  .sys{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:0 0 14px;font-size:12.5px}
  .sys .h{padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:600}
  .sys pre{display:none;margin:0;padding:0 12px 12px;white-space:pre-wrap;word-break:break-word;
    font-family:ui-monospace,Menlo,monospace;font-size:12px;max-height:340px;overflow:auto}
  .sys.open pre{display:block}

  .msg{display:flex;margin:9px 0}
  .msg.user{justify-content:flex-end}
  .bubble{max-width:78%;padding:9px 13px;border-radius:15px;word-break:break-word}
  .msg.user .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .msg.assistant .bubble{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
  .bubble p{margin:0 0 8px}
  .bubble p:last-child,.bubble ul:last-child,.bubble ol:last-child,.bubble pre.md-pre:last-child{margin-bottom:0}
  .bubble ul,.bubble ol{margin:6px 0;padding-left:22px}
  .bubble li{margin:2px 0}
  .bubble .md-h{font-weight:600;margin:8px 0 4px}
  .bubble a{color:inherit;text-decoration:underline}
  .bubble blockquote{margin:6px 0;padding-left:10px;border-left:3px solid rgba(120,130,140,.35)}
  .bubble code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:5px;font-family:ui-monospace,Menlo,monospace;font-size:.9em}
  .msg.user .bubble code{background:rgba(255,255,255,.22)}
  .bubble pre.md-pre{background:#0e141b;color:#d6e2f0;padding:9px;border-radius:8px;overflow:auto;margin:6px 0;max-height:360px}
  .bubble pre.md-pre code{background:none;padding:0;color:inherit;font-size:12px}

  .tool{margin:6px 0 6px 10px;border:1px solid var(--line);border-radius:10px;background:#f7f9fb;max-width:88%}
  .tool.result{background:#f4f6f4}
  .toolhead{padding:6px 11px;cursor:pointer;color:#57636f;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;
    display:flex;gap:8px;align-items:center}
  .toolhead .exp{margin-left:auto;color:var(--accent);font-size:11px}
  .toolbody{display:none;padding:0 11px 9px}
  .tool.open .toolbody{display:block}
  pre.code{white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Menlo,monospace;font-size:12px;
    background:#0e141b;color:#d6e2f0;padding:9px;border-radius:8px;overflow:auto;max-height:360px;margin:0}

  .dpbox{position:relative;border:1px solid #d5dbe2;border-radius:14px;background:var(--panel);padding:12px 14px 8px;
    margin:16px 0 22px;box-shadow:0 1px 4px rgba(20,30,45,.05)}
  .dptitle{font-weight:600;text-align:center;color:#3a4552;font-size:13.5px;margin-bottom:10px}
  .dpnote{position:absolute;right:calc(100% + 22px);top:0;width:240px;background:#dde3ec;border:1px solid #c1cad8;
    border-right:3px solid #93a0b3;border-radius:8px;padding:8px 11px;font-size:12.5px;color:#454f5e;
    font-style:italic;box-shadow:0 1px 5px rgba(30,40,60,.12)}
  .dpnote p{margin:0}
  @media (max-width:1180px){ .dpnote{position:static;width:auto;right:auto;margin:0 0 10px} }

  #dpmap{position:fixed;top:0;right:18px;width:48px;height:100vh;z-index:6;pointer-events:none}
  .dpmark{position:absolute;right:0;width:26px;height:9px;border-radius:3px;transform:translateY(-50%);
    background:#8b95a3;cursor:pointer;pointer-events:auto;opacity:.85;box-shadow:0 0 0 1px rgba(255,255,255,.85);
    transition:width .12s ease,opacity .12s ease,background .12s ease}
  .dpmark:hover{width:42px;opacity:1;background:#5f6b7a}
  .dp{margin:4px 0 0}
  .dpsvg{display:flex;justify-content:center;overflow-x:auto;margin:2px 0 10px}
  .dplegend{max-width:620px;margin:0 auto}
  .legrow{display:flex;align-items:center;gap:9px;margin:4px 0}
  .legdir{width:14px;text-align:center;color:var(--muted);flex:none}
  .sw{width:13px;height:13px;border-radius:3px;flex:none}
  .legname{max-width:520px}
  .legval{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:auto}
</style>
</head>
<body>
<header>
  <h1 id="title">loading…</h1>
</header>
<main id="main"><div class="drop">loading…</div></main>

<script>
"use strict";
const SPEC = ["#2f9e6f","#3b6fe0","#8e44ad","#c9932f","#1697a6","#d1477a","#5a7d2a","#b5651d"];
const $ = s => document.querySelector(s);

fetch("./viz.json").then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
  .then(render)
  .catch(err=>{ const t=document.getElementById("title"); if(t) t.textContent="failed to load viz.json ("+err.message+")"; });

function esc(s){ return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function clip(s,n){ s=String(s); return s.length>n ? s.slice(0,n)+"\n… (truncated — see raw file)" : s; }

// Minimal, offline markdown -> HTML (bold/italic/code/fences/lists/headings/links/quotes).
function mdInline(s){
  return s
    .replace(/\*\*([^*]+?)\*\*/g,'<strong>$1</strong>')
    .replace(/__([^_]+?)__/g,'<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\*)/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src){
  src = String(src).trim();
  const store=[];
  src = src.replace(/```[^\n]*\n?([\s\S]*?)```/g,(m,code)=>{ store.push(`<pre class="md-pre"><code>${esc(code.replace(/\n+$/,''))}</code></pre>`); return `\u0000B${store.length-1}\u0000`; });
  src = src.replace(/`([^`\n]+)`/g,(m,c)=>{ store.push(`<code>${esc(c)}</code>`); return `\u0000I${store.length-1}\u0000`; });
  src = esc(src);
  let out="", para=[], list=null;
  const fp=()=>{ if(para.length){ out+=`<p>${mdInline(para.join('<br>'))}</p>`; para=[]; } };
  const fl=()=>{ if(list){ out+=`<${list.t}>`+list.items.map(x=>`<li>${mdInline(x)}</li>`).join('')+`</${list.t}>`; list=null; } };
  const f=()=>{ fp(); fl(); };
  for(const line of src.split('\n')){
    const t=line.trim(); let m;
    if(!t){ f(); continue; }
    if(/^\u0000B\d+\u0000$/.test(t)){ f(); out+=t; continue; }
    if(m=line.match(/^(#{1,6})\s+(.*)$/)){ f(); out+=`<div class="md-h">${mdInline(m[2])}</div>`; continue; }
    if(/^(---|\*\*\*|___)\s*$/.test(t)){ f(); out+="<hr>"; continue; }
    if(m=line.match(/^\s*[-*+]\s+(.*)$/)){ fp(); if(!list||list.t!=="ul"){ fl(); list={t:"ul",items:[]}; } list.items.push(m[1]); continue; }
    if(m=line.match(/^\s*\d+\.\s+(.*)$/)){ fp(); if(!list||list.t!=="ol"){ fl(); list={t:"ol",items:[]}; } list.items.push(m[1]); continue; }
    if(m=line.match(/^&gt;\s?(.*)$/)){ f(); out+=`<blockquote>${mdInline(m[1])}</blockquote>`; continue; }
    para.push(line);
  }
  f();
  return out.replace(/\u0000[BI](\d+)\u0000/g,(m,i)=>store[+i]);
}

function colorize(dist){
  let si=0;
  return dist.map(d=>({...d, color: d.kind==="refusal"?"#e2523b":d.kind==="generic"?"#9aa4b0":SPEC[si++%SPEC.length]}));
}
function attrEsc(s){ return esc(s).replace(/"/g,"&quot;"); }
function dominantColor(dp){
  const c=colorize(dp.distribution);
  return c.length ? c.reduce((a,b)=>b.count>a.count?b:a).color : "#9aa4b0";
}
function markerTitle(dp){
  if(dp.note) return dp.note;
  const c=colorize(dp.distribution);
  if(!c.length) return "Decision point";
  const top=c.reduce((a,b)=>b.count>a.count?b:a);
  return `${top.category} — ${Math.round(100*top.count/(dp.total||1))}%`;
}

// Fixed minimap of clickable decision-point markers down the right edge.
function renderScrollMarkers(){
  let map=document.getElementById("dpmap");
  if(!map){ map=document.createElement("div"); map.id="dpmap"; document.body.appendChild(map); }
  map.innerHTML="";
  const boxes=[...document.querySelectorAll(".dpbox")];
  if(!boxes.length){ map.style.display="none"; return; }
  map.style.display="block";
  const docH=Math.max(document.documentElement.scrollHeight, window.innerHeight);
  boxes.forEach(box=>{
    const y=box.getBoundingClientRect().top + window.scrollY + box.offsetHeight/2;
    const mk=document.createElement("a");
    mk.className="dpmark";
    mk.style.top=Math.min(99, Math.max(0.5, y/docH*100))+"%";
    mk.title=box.dataset.title||"Decision point";
    mk.addEventListener("click",()=> box.scrollIntoView({behavior:"smooth",block:"center"}));
    map.appendChild(mk);
  });
}
window.addEventListener("resize",()=>{ if(document.querySelector(".dpbox")) renderScrollMarkers(); });

// vertical ribbon: source segment [sx0,sx1]@sy  ->  bottom node [bx0,bx1]@by
function vRibbon(sx0,sx1,sy,bx0,bx1,by,fill,op,extra){
  const mid=(sy+by)/2;
  return `<path d="M ${sx0},${sy} C ${sx0},${mid} ${bx0},${mid} ${bx0},${by} L ${bx1},${by} C ${bx1},${mid} ${sx1},${mid} ${sx1},${sy} Z" fill="${fill}" fill-opacity="${op}" ${extra||""}/>`;
}

// Downward fork emanating from the decision message above: refusals peel
// down-LEFT, all other outcomes fan down-RIGHT. Ghost refusal always shown.
function widget(dp){
  const dist = colorize(dp.distribution);
  const total = dp.total || dist.reduce((a,d)=>a+d.count,0) || 1;
  const refusalCat = dist.find(d=>d.kind==="refusal");
  const refusal = refusalCat ? refusalCat.count : 0;
  const ghost = !refusalCat;
  const rights = dist.filter(d=>d.kind!=="refusal");
  const rightTotal = rights.reduce((a,d)=>a+d.count,0) || 1;
  const pct = c => Math.round(100*c/total) + "%";

  const W=680, top=14, srcH=12, H=150, nodeH=14, gapX=16;
  const srcW=180, srcX0=W/2 - srcW/2, srcBottom=top+srcH, nodeY=top+H;
  const refusalW = srcW*refusal/total;
  const svgH = nodeY + nodeH + 24;

  let s = `<svg width="${W}" height="${svgH}" viewBox="0 0 ${W} ${svgH}">`;
  s += `<rect x="${srcX0}" y="${top}" width="${srcW}" height="${srcH}" rx="3" fill="#2b3440"/>`;

  // ---- refusal: down-LEFT ----
  const refLeft = 66;
  if(ghost){
    const gx0=refLeft, gx1=refLeft+22;
    s += vRibbon(srcX0, srcX0+6, srcBottom, gx0, gx1, nodeY, "#e2523b", 0.05,
                 'stroke="#e2523b" stroke-opacity="0.25" stroke-dasharray="3 3"');
    s += `<rect x="${gx0}" y="${nodeY}" width="22" height="${nodeH}" rx="3" fill="#e2523b" fill-opacity="0.12" stroke="#e2523b" stroke-opacity="0.55" stroke-dasharray="3 3"/>`;
    s += `<text x="${(gx0+gx1)/2}" y="${nodeY+nodeH+14}" text-anchor="middle" font-size="11" fill="#c0574a">refusal · 0%</text>`;
  } else {
    const w=Math.max(4,refusalW), bx0=refLeft, bx1=refLeft+w;
    s += vRibbon(srcX0, srcX0+refusalW, srcBottom, bx0, bx1, nodeY, "#e2523b", 0.5);
    s += `<rect x="${bx0}" y="${nodeY}" width="${w}" height="${nodeH}" rx="3" fill="#e2523b"/>`;
    s += `<text x="${(bx0+bx1)/2}" y="${nodeY+nodeH+14}" text-anchor="middle" font-size="11" fill="#c0574a">refusal · ${pct(refusal)}</text>`;
  }

  // ---- other outcomes: down-RIGHT ----
  const srcX1 = srcX0 + srcW;
  const rightGhost = rights.length === 0;   // 100% refusals -> ghost non-refusal
  if(rightGhost){
    const gx0=W-66-22, gx1=W-66;            // mirror of the ghost refusal node
    s += vRibbon(srcX1-6, srcX1, srcBottom, gx0, gx1, nodeY, "#9aa4b0", 0.06,
                 'stroke="#9aa4b0" stroke-opacity="0.35" stroke-dasharray="3 3"');
    s += `<rect x="${gx0}" y="${nodeY}" width="22" height="${nodeH}" rx="3" fill="#9aa4b0" fill-opacity="0.14" stroke="#9aa4b0" stroke-opacity="0.6" stroke-dasharray="3 3"/>`;
    s += `<text x="${(gx0+gx1)/2}" y="${nodeY+nodeH+14}" text-anchor="middle" font-size="11" fill="#6b7787">non-refusal · 0%</text>`;
  } else {
    // Widths scaled to the WHOLE (same srcW scale as refusal), and the outcome
    // group is RIGHT-anchored (mirror of the left-anchored refusal) so the
    // ribbons fan down-RIGHT instead of curving back like the refusal side.
    const bws = rights.map(d=>Math.max(4, srcW*d.count/total));
    const totalOW = bws.reduce((a,b)=>a+b,0) + (rights.length-1)*gapX;
    let sx=srcX0+refusalW, bx=(W - refLeft) - totalOW;
    rights.forEach((d,idx)=>{
      const sw=srcW*d.count/total, bw=bws[idx];
      const sx0=sx, sx1=sx+sw; sx=sx1;
      const bx0=bx, bx1=bx+bw; bx=bx1+gapX;
      s += vRibbon(sx0, sx1, srcBottom, bx0, bx1, nodeY, d.color, 0.45);
      s += `<rect x="${bx0}" y="${nodeY}" width="${bw}" height="${nodeH}" rx="3" fill="${d.color}"/>`;
      s += `<text x="${(bx0+bx1)/2}" y="${nodeY+nodeH+14}" text-anchor="middle" font-size="11" fill="#57636f">${pct(d.count)}</text>`;
    });
  }
  s += `</svg>`;

  const ghostLeg = ghost
    ? `<div class="legrow"><span class="sw" style="background:#e2523b;opacity:.3"></span><span class="legdir">◀</span><span class="legname muted">refusal</span><span class="legval">0%</span></div>`
    : "";
  const rightGhostLeg = rightGhost
    ? `<div class="legrow"><span class="sw" style="background:#9aa4b0;opacity:.3"></span><span class="legdir">▶</span><span class="legname muted">non-refusal</span><span class="legval">0%</span></div>`
    : "";
  const legend = dist.map(d=>{
    const dir = d.kind==="refusal" ? "◀" : "▶";
    return `<div class="legrow"><span class="sw" style="background:${d.color}"></span>`
      + `<span class="legdir">${dir}</span><span class="legname">${esc(d.category)}</span>`
      + `<span class="legval">${pct(d.count)}</span></div>`;
  }).join("");

  return `<div class="dp"><div class="dpsvg">${s}</div><div class="dplegend">${ghostLeg}${legend}${rightGhostLeg}</div></div>`;
}

// Strip openclaw's "Sender (untrusted metadata): ```json {…} ```" wrapper that
// prefixes real human messages, leaving just the message (timestamp + text).
function cleanUserText(t){
  return String(t).replace(/^Sender \(untrusted metadata\):\s*```json[\s\S]*?```\s*/, "").trimStart();
}

function renderBlock(role,b){
  if(b.type==="text"){
    let txt = (role==="user" ? cleanUserText(b.text) : b.text || "").trim();
    if(!txt) return "";
    const who = role==="user" ? "user" : "assistant";
    return `<div class="msg ${who}"><div class="bubble md">${md(txt)}</div></div>`;
  }
  if(b.type==="tool_use"){
    const code = b.fn ? clip(b.fn,6000) : clip(JSON.stringify(b.input,null,2),3000);
    return `<div class="tool"><div class="toolhead">⚙ ${esc(b.name||"tool")}`
      + `${b.fn?' <span class="muted">· evaluate</span>':''}<span class="exp">show ▾</span></div>`
      + `<div class="toolbody"><pre class="code">${esc(code)}</pre></div></div>`;
  }
  if(b.type==="tool_result"){
    const err = b.is_error ? " (error)" : "";
    return `<div class="tool result"><div class="toolhead">↩ tool result${err}<span class="exp">show ▾</span></div>`
      + `<div class="toolbody"><pre class="code">${esc(clip(b.content,4000))}</pre></div></div>`;
  }
  return "";
}

function renderMessage(m){ return m.blocks.map(b=>renderBlock(m.role,b)).join(""); }

function render(data){
  { const _t = `${data.run_id} — ${data.conversation.length} messages, ${data.decision_points.length} decision points`;
    document.title = _t; const _e = document.getElementById("title"); if(_e) _e.textContent = _t; }
  const anchors = {};
  (data.decision_points||[]).forEach(dp=>{ (anchors[dp.anchor]=anchors[dp.anchor]||[]).push(dp); });

  let html = "";
  if(data.system){
    html += `<div class="sys"><div class="h">System prompt (${data.system.length.toLocaleString()} chars) — click to expand</div><pre>${esc(data.system)}</pre></div>`;
  }
  data.conversation.forEach((m,i)=>{
    if(anchors[i] && anchors[i].length){
      // this message was resampled — box it together with the fork
      const dps = anchors[i];
      html += `<div class="dpbox" data-color="${dominantColor(dps[0])}" data-title="${attrEsc(markerTitle(dps[0]))}"><div class="dptitle">Decision point — sampled ${dps[0].total} times</div>`;
      if(dps[0].note) html += `<div class="dpnote">${md(String(dps[0].note))}</div>`;
      html += renderMessage(m);
      dps.forEach(dp=> html += widget(dp));
      html += `</div>`;
    } else {
      html += renderMessage(m);
    }
  });
  Object.keys(anchors).map(Number).filter(a=>a>=data.conversation.length).sort((a,b)=>a-b)
    .forEach(a=>anchors[a].forEach(dp=>{
      const note = dp.note ? `<div class="dpnote">${md(String(dp.note))}</div>` : "";
      html += `<div class="dpbox" data-color="${dominantColor(dp)}" data-title="${attrEsc(markerTitle(dp))}"><div class="dptitle">Decision point — sampled ${dp.total} times</div>${note}${widget(dp)}</div>`;
    }));

  const main = $("#main"); main.innerHTML = html;
  // collapsibles
  main.querySelectorAll(".toolhead").forEach(h=>h.addEventListener("click",()=>{ h.parentElement.classList.toggle("open"); renderScrollMarkers(); }));
  const sys = main.querySelector(".sys"); if(sys) sys.querySelector(".h").addEventListener("click",()=>{ sys.classList.toggle("open"); renderScrollMarkers(); });
  renderScrollMarkers();
}
</script>
</body>
</html>
